<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple_login</title>
    <style>
        body{
            text-align: center;
            background-color:rgb(228, 197, 76);
            font-family: Arial, Helvetica, sans-serif;
            padding-bottom: 35%;
            margin: 25%;
        }
        .login{
            font-size: large;
            color: rgb(13, 13, 17);
            margin-bottom: 10%;
        }
        #user{
            font-size: medium;
           padding-bottom: 0.5%;
           margin-bottom: 2.5%;
        }
        #pass{
            font-size: medium;
            padding-bottom: 0.5%;
            margin-bottom: 2.5%;
        }
        .button{
            color: rgb(73, 37, 233);
            font-size: small;
            width: 35%;
        }
        #aa{
            background-color: rgb(16, 228, 122);
            font-size: medium;
            margin-top: 20px;
        }
        
    </style>
</head>
<body>
   <div class="login">
    <h1>USER LOGIN</h1>
   <form action="">
    <h4>username:<input type="text" id="user" placeholder="username"></h4>
    <h4>password:<input type="password" id="pass" placeholder="password"></h4>
    <button onclick="login(user.value,pass.value) " id="aa">login</button>
</form>
    </div>
   <script>
   function login(user,pass){
    if (user=="satyaveni" && pass==1234){
        alert("login successful");
    }
    else{
        alert("invalid login credentials");
    }
   }
    </script>
</body>
</html>
